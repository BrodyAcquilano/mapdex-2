<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Mapdex | Event & Resource Mapping Platform</title>

    <!-- Basic SEO -->
    <meta
      name="description"
      content="Mapdex is a dynamic event and resource mapping platform for structured, multi-layered geographic data visualization and time-based analysis."
    />
    <meta name="author" content="Mapdex" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (for social previews) -->
    <meta
      property="og:title"
      content="Mapdex – Dynamic Event & Resource Mapping Platform"
    />
    <meta property="og:site_name" content="Mapdex" />
    <meta
      property="og:description"
      content="Structured geographic visualization for events and resources."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mapdex.ca" />
    <meta
      property="og:image"
      content="https://mapdex.ca/screenshots/social-preview.png"
    />

    <!-- Twitter Card (for social previews) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Mapdex – Dynamic Event & Resource Mapping Platform"
    />
    <meta
      name="twitter:description"
      content="Structured geographic visualization for events and resources."
    />
    <meta
      name="twitter:image"
      content="https://mapdex.ca/screenshots/social-preview.png"
    />

    <!-- Canonical link (for social previews) -->
    <link rel="canonical" href="https://mapdex.ca" />
    <!-- PWA -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
